# Once a month, checks every external link the hub cites (sources, organisations, resources) and opens or
# updates an issue listing the broken ones, for the evidence checkers to re-read or replace.
name: Monthly link check
on:
  schedule:
    - cron: "41 6 2 * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect the external links from the hub
        run: |
          grep -oE 'https://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' dist/bhm-2026-hub.html \
            | sed -E 's/[),.;:]+$//' | grep -v '\$' | grep -vE 'fonts\.(googleapis|gstatic)\.com|cyberdudeuk\.github\.io|schema\.org|w3\.org' \
            | sort -u > links.txt
          wc -l links.txt
      - name: Check the links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 --timeout 30 --max-retries 2 --accept 200..=299,403,429 links.txt
          output: link-report.md
          fail: false
      - name: Find last month's report, if still open
        id: open
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'link-check', per_page: 1 });
            return open.data.length ? String(open.data[0].number) : '';
      - name: Open or update the link report
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Monthly link check found broken links
          content-filepath: link-report.md
          issue-number: ${{ steps.open.outputs.result }}
          labels: link-check, source
