# Code scanning: looks for security problems in the hub's JavaScript and in the workflows.
# Results appear in Security → Code scanning.
name: CodeQL
on:
  pull_request:
    paths: ["src/**/*.js", "src/**/*.mjs", "tests/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["src/**/*.js", "src/**/*.mjs", "tests/**", ".github/workflows/**"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore: [dist, site, data, src/vendor, tests/vendor]
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
