# Runs on every pull request and push to main: a privacy scan, open-data and licence checks, the hub's in-page self-checks on both editions
# (after checking the committed pages match a fresh build), and an axe-core accessibility scan of every page.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No personal contact details or private links in the repository
        run: |
          set +e
          bad=$(grep -rIlE '[A-Za-z0-9._%+-]+@(gmail|hotmail|outlook|yahoo|icloud)\.[a-z.]+|claude\.ai/(code/)?artifact/' --exclude-dir=.git --exclude-dir=node_modules . )
          if [ -n "$bad" ]; then echo "::error::Personal email or private link found in: $bad"; exit 1; fi
          echo "clean"
      - name: Nothing personal inside the built pages or their embedded files
        run: python3 tests/privacy_scan.py dist/bhm-2026-hub.html site/index.html
      - name: Open data and website files are valid, sourced and within size budgets
        run: python3 tests/validate_data.py
      - name: Every vendored file and dependency has a recorded licence
        run: python3 tests/licence_check.py
      - name: Event suggestions are checked before they reach the calendar
        run: python3 tests/test_event_intake.py
      - name: Workflows are valid (actionlint, with shellcheck on every script)
        run: |
          python3 -m pip install --quiet --user --break-system-packages actionlint-py==1.7.12.25 shellcheck-py==0.11.0.1
          base=$(python3 -m site --user-base)
          export PATH="$base/bin:$PATH"
          actionlint .github/workflows/*.yml
          shellcheck tests/negative.sh
  selfchecks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies and Chromium
        run: |
          npm ci || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: The committed pages match a fresh build from src/
        run: |
          npm run -s build
          npm run -s build:pages
          git diff --stat --exit-code -- dist/bhm-2026-hub.html site/index.html || { echo "::error::dist/ or site/ is out of date: run npm run build:all and commit"; exit 1; }
      - name: Run the in-page self-checks
        run: npm run -s test:quick
      - name: Checks of the checks (each check must fail on an injected defect)
        run: bash tests/negative.sh
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # about 30 minutes: 55 pages at two widths
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies and Chromium
        run: |
          npm ci || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: axe-core on every page, 1280px light and 390px dark
        run: node tests/ci-axe.mjs site/index.html
