name: Dependency review
# Stops a pull request that adds a dependency with a known moderate or worse vulnerability. GitHub's dependency graph does
# the work; nothing from the pull request is installed or run. GitHub-owned action, pinned to a reviewed commit (copied from cyberdudeuk/dcat-ap-uk).
on: [pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with: {fail-on-severity: moderate}
