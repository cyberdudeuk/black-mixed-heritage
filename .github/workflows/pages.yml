# Deploys the hub to GitHub Pages, with a list of open ideas and feature wishes (ideas.json) that the hub shows
# in its ideas box, and the latest result of each repository workflow (checks.json) that the Assurance page shows.
# The ideas list holds titles, labels, support counts and links only: no issue text and no usernames.
# The site itself is built locally with: node src/build_pages.mjs https://OWNER.github.io/REPO/ site
name: Deploy hub to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", ".github/workflows/pages.yml"]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_run: # refresh checks.json when a repository workflow finishes on main
    workflows: ["Checks", "CodeQL", "Scorecard", "Website health", "Monthly link check", "Release"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # reactions (thumbs-up support) do not trigger events, so refresh every six hours
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: read
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # issue events only matter for ideas and wishes, and for anything marked done
    if: "github.event_name != 'issues' || contains(join(github.event.issue.labels.*.name, ','), 'idea') || contains(join(github.event.issue.labels.*.name, ','), 'wishlist') || contains(join(github.event.issue.labels.*.name, ','), 'status: done') || github.event.action == 'unlabeled' || github.event.action == 'deleted'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the build is complete and self-contained
        run: |
          test -s site/index.html
          grep -q '<html lang="en-GB">' site/index.html
          grep -q 'microsoftTeams' site/index.html
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/* _site/data/
      - name: Publish the list of ideas and wishes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const STATUS = ['accepted', 'planned', 'in-progress', 'done', 'declined'];
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            // the same patterns as issue-triage.yml, applied here too: triage runs at the same time and its label does not start a new deploy
            const PII = [/[\w.+-]+@[\w-]+\.[\w.-]+/, /(?:\+44\s?|\b0)(?:\d[\s-]?){9,10}\b/, /\b[A-CEGHJ-PR-TW-Z]{2}\s?\d{2}\s?\d{2}\s?\d{2}\s?[A-D]\b/i];
            const items = [];
            for (const i of issues) {
              if (i.pull_request) continue;
              const labels = i.labels.map(l => (typeof l === 'string' ? l : l.name));
              const isWish = labels.includes('wishlist');
              if (!isWish && !labels.includes('idea')) continue;
              if (labels.includes('needs-redaction')) continue; // never republish an issue that may hold personal data
              if (PII.some(rx => rx.test(i.title + '\n' + (i.body || '')))) continue;
              const st = (labels.find(l => l.startsWith('status: ')) || '').slice(8);
              const page = ((i.body || '').match(/###\s*Page\s*\n+\s*(.+)/) || [])[1] || '';
              items.push({
                n: i.number,
                url: i.html_url,
                title: i.title.replace(/^\[(Idea|Wish)\]\s*/i, '').slice(0, 140),
                kind: isWish ? 'wish' : 'idea',
                status: STATUS.includes(st) ? st : 'new',
                votes: (i.reactions && i.reactions['+1']) || 0,
                comments: i.comments || 0,
                created: i.created_at.slice(0, 10),
                page: page === '_No response_' ? '' : page.trim().slice(0, 80)
              });
            }
            // "You said, we did": closed suggestions labelled "status: done" (titles, kind and date only), shown on Help run the hub
            const TYPES = { idea: 'idea', wishlist: 'wish', correction: 'correction', bug: 'bug', accessibility: 'accessibility' };
            const closed = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'closed', labels: 'status: done', per_page: 100
            });
            const done = [];
            for (const i of closed) {
              if (i.pull_request) continue;
              const labels = i.labels.map(l => (typeof l === 'string' ? l : l.name));
              if (labels.includes('needs-redaction')) continue;
              const type = Object.keys(TYPES).find(k => labels.includes(k));
              if (!type) continue;
              if (PII.some(rx => rx.test(i.title))) continue;
              done.push({ n: i.number, url: i.html_url, title: i.title.replace(/^\[[A-Za-z ]+\]\s*/, '').slice(0, 140), type: TYPES[type], closed: (i.closed_at || '').slice(0, 10) });
            }
            fs.writeFileSync('_site/ideas.json', JSON.stringify({ generated: new Date().toISOString(), repo: context.repo.owner + '/' + context.repo.repo, items, done }, null, 1));
            core.info(`ideas.json: ${items.length} open items, ${done.length} done`);
      - name: Publish the latest repository check results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const NAMES = ['Checks', 'CodeQL', 'Scorecard', 'Website health', 'Monthly link check', 'Release'];
            const wfs = (await github.rest.actions.listRepoWorkflows({ ...context.repo, per_page: 100 })).data.workflows;
            const runs = [];
            for (const name of NAMES) {
              const wf = wfs.find(w => w.name === name);
              if (!wf) continue;
              const r = (await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: wf.id, branch: 'main', per_page: 5 })).data.workflow_runs
                .find(x => x.event !== 'pull_request');
              if (!r) continue;
              let jobs = [];
              if (name === 'Checks') jobs = (await github.rest.actions.listJobsForWorkflowRun({ ...context.repo, run_id: r.id })).data.jobs.map(j => ({ name: j.name, conclusion: j.conclusion || j.status }));
              runs.push({ workflow: name, status: r.status, conclusion: r.conclusion, when: r.updated_at, url: r.html_url, sha: r.head_sha, jobs });
            }
            fs.writeFileSync('_site/checks.json', JSON.stringify({ generated: new Date().toISOString(), runs }, null, 1));
            core.info(`checks.json: ${runs.length} workflows`);
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true # keeps .well-known/security.txt and .nojekyll
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
