# Deploys the prebuilt hub in site/ to GitHub Pages on every push to main.
# The site is built locally with: node build_pages.mjs https://OWNER.github.io/REPO/ site
name: Deploy hub to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the build is complete and self-contained
        run: |
          test -s site/index.html
          grep -q '<html lang="en-GB">' site/index.html
          grep -q 'microsoftTeams' site/index.html
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
