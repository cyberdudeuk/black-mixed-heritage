# Keeps the repository's labels in step with .github/labels.json (creates or updates; never deletes).
name: Sync labels
on:
  push:
    branches: [main]
    paths: [".github/labels.json"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const want = JSON.parse(require('fs').readFileSync('.github/labels.json', 'utf8'));
            const have = await github.paginate(github.rest.issues.listLabelsForRepo, { ...context.repo, per_page: 100 });
            for (const l of want) {
              const cur = have.find(h => h.name.toLowerCase() === l.name.toLowerCase());
              if (!cur) { await github.rest.issues.createLabel({ ...context.repo, name: l.name, color: l.color, description: l.description }); core.info('created ' + l.name); }
              else if (cur.color !== l.color || (cur.description || '') !== l.description) { await github.rest.issues.updateLabel({ ...context.repo, name: cur.name, color: l.color, description: l.description }); core.info('updated ' + l.name); }
            }
