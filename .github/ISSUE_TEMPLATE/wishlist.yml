name: "Feature wish"
description: "Ask for a new feature"
title: "[Wish] "
labels: ["wishlist", "enhancement"]
body:
  - type: markdown
    attributes:
      value: "Issues are public. Do not include names, contact details, health information or anything sensitive."
  - type: dropdown
    id: page
    attributes:
      label: "Page"
      options:
        - "Whole hub"
        - "Overview"
        - "History and arc"
        - "Maps"
        - "Life stages and identities"
        - "Inequalities and action"
        - "Benchmarks"
        - "Culture, sport and enterprise"
        - "Book and film club"
        - "Learning, games and community"
        - "Talent, leadership and research"
        - "Help run the hub"
        - "Dashboards"
        - "Knowledge layer"
        - "Review and assessment"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: "The feature"
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: "The need behind it"
      description: "As a ..., I want ..., so that ..."
    validations:
      required: false
