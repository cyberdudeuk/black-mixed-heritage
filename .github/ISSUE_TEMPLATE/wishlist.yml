name: "Feature wish"
description: "Ask for a new feature"
title: "[Wish] "
labels: ["wishlist", "enhancement"]
body:
  - type: markdown
    attributes:
      value: "Issues are public. Do not include names, contact details, health information or anything sensitive."
  - type: dropdown
    id: page
    attributes:
      label: "Page"
      options:
        - "Whole hub"
        - "Overview"
        - "The 2026 theme"
        - "Calendar"
        - "Organiser toolkit"
        - "Posters"
        - "Get involved"
        - "Networks and communities"
        - "Book and film club"
        - "Remember"
        - "Food and heritage"
        - "For leaders"
        - "Inequalities and action"
        - "Benchmarks and comparisons"
        - "Life stages and identities"
        - "Careers and development"
        - "Talent, leadership and research"
        - "Black enterprise"
        - "Young lives: NEET, BEET and CHEET"
        - "Representation across the state"
        - "History"
        - "Africa’s knowledge and its journeys"
        - "What was taken, lost and might have been"
        - "Who built the stereotypes"
        - "Africa: patterns, symbols and languages"
        - "Innovation and invention"
        - "Frontier tech in Africa"
        - "Culture, sport and enterprise"
        - "Futures 2030 to 2100"
        - "What it means to be Black"
        - "The African diaspora"
        - "Words matter: race, ethnicity and language"
        - "Africa: many cultures, many kinds of knowledge"
        - "Africa: peoples, regions, borders and displacement"
        - "DNA, genomes and African ancestry"
        - "Myths and facts"
        - "Identity, heritage and respect"
        - "Current debates"
        - "For schools and educators"
        - "Curriculum and reference works"
        - "Resources"
        - "Partners and archives"
        - "Brand and media"
        - "Connect and share"
        - "Through other lenses"
        - "The DEEIA lens"
        - "Questions people ask"
        - "User guide and tours"
        - "About this hub"
        - "Help run the hub"
        - "Knowledge layer"
        - "Dashboards"
        - "Design and architecture"
        - "Self-checks, stories and journeys"
        - "Review and assessment"
        - "Assurance"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: "The feature"
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: "The need behind it"
      description: "As a ..., I want ..., so that ..."
    validations:
      required: false
