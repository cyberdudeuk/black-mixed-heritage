# Keeps the GitHub Actions used by the workflows up to date, in one grouped pull request a month,
# so that updates to the same workflow file never conflict with each other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [enhancement]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: [enhancement]
    groups:
      test-tools:
        patterns: ["*"]
